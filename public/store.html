<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Orders</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#171a21"><meta name="mobile-web-app-capable" content="yes">
<script>try { document.documentElement.dataset.theme = localStorage.getItem('hb_theme') || 'ranch'; } catch (e) { document.documentElement.dataset.theme = 'ranch'; }</script>
<style>
  /* Dark and Ranch looks (same as the rest of HomeBoard); the store's own color stays its own. */
  :root {
    --bg: #121418; --panel: #17191e; --card: #22262e; --line: #2e323b;
    --text: #f1f2f4; --muted: #9aa0aa; --accent: #d9a93a; --head: #d9a93a;
    --new: #5b9cf0; --picking: #f0b46a; --ready: #7cc04a; --late: #ef5350;
    --btn: #2a2e36; --opt: #c9cdd4; --notebg: #3a2f12; --notetx: #f0d27a; --flash: #2c3a22;
    --onbg: #1f2a17; --ontx: #8fd16a; --onb: #7cc04a; --donebtn: #e6e8ec; --brand: #f1f2f4;
  }
  html[data-theme=ranch] {
    --bg: #efe5cf; --panel: linear-gradient(180deg, #e7d4ac, #d9c093); --card: #fffaf0; --line: #d8c9a8;
    --text: #2b2417; --muted: #7a6a50; --accent: #2f5a2a; --head: #7f3b33;
    --new: #24496e; --picking: #b8741a; --ready: #2f5a2a; --late: #8b2e24;
    --btn: #ece2cc; --opt: #4a3d28; --notebg: #f6e3c0; --notetx: #6b3f0b; --flash: #fde7b0;
    --onbg: #dfe9d4; --ontx: #2f5a2a; --onb: #2f5a2a; --donebtn: #ead9b6; --brand: #7f3b33;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  html[data-theme=ranch] header { border-bottom-color: #c4a874; }
  html[data-theme=ranch] .meta { color: #4a3d28; }
  .brand { display: flex; align-items: center; font-size: 22px; font-weight: 700; color: var(--brand); }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); margin-right: 10px; }
  .meta { display: flex; align-items: center; color: var(--muted); font-size: 16px; }
  .meta > * { margin-left: 18px; }
  #clock { color: var(--text); font-size: 22px; font-variant-numeric: tabular-nums; }
  .conn { display: inline-flex; align-items: center; }
  .conn i { width: 10px; height: 10px; border-radius: 50%; background: var(--late); margin-right: 6px; }
  .conn.ok i { background: var(--ready); }
  main { display: flex; height: calc(100% - 56px); }
  .col { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--line); min-width: 0; }
  .col:last-child { border-right: 0; }
  .col h2 { margin: 0; padding: 10px 14px; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--head);
    display: flex; justify-content: space-between; border-bottom: 3px solid var(--line); }
  .col[data-s=new] h2 { border-color: var(--new); }
  .col.cc h2 { border-color: var(--cc); align-items: center; }
  .col.cc h2 .gear { margin-left: 8px; background: transparent; border: 0; color: var(--muted); font-size: 17px; cursor: pointer; padding: 2px 6px; }
  .ticket.cc { border-left-color: var(--cc); }
  .flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .flags button { font-size: 13.5px; font-weight: 700; padding: 6px 10px; border-radius: 99px; border: 1.5px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
  .flags button.on { background: var(--cc); border-color: var(--cc); color: #fff; }
  .ord { display: flex; gap: 6px; margin-top: 8px; }
  .ord button { flex: 1; padding: 8px 0; border-radius: 8px; border: 1px solid var(--line); background: var(--btn); color: var(--text); font-size: 15px; font-weight: 700; cursor: pointer; }
  .ord button:disabled { opacity: .35; cursor: default; }
  .col.cc .ticket.cc .actions button:first-child { background: var(--cc); color: #fff; }
  .col.cc .ticket.cc.ready .actions button:first-child { background: var(--donebtn); color: var(--text); }
  #dlg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  #dlg.open { display: flex; }
  #dlgbox { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: 100%; max-width: 520px; max-height: 92vh; overflow: auto; }
  #dlgbox h3 { margin: 0 0 10px; color: var(--head); font-size: 20px; }
  #dlgbox label { display: block; font-size: 14px; font-weight: 700; margin: 12px 0 4px; }
  #dlgbox input, #dlgbox select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
  #dlgbox input[type=color] { padding: 2px; height: 40px; }
  #dlgbox button { font: inherit; font-weight: 700; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--btn); color: var(--text); cursor: pointer; }
  #dlgbox button:disabled { opacity: .35; cursor: default; }
  #dlgbox button.pri { background: var(--accent2, #2f5a2a); border-color: transparent; color: #fff; }
  #dlgbox button.del { background: var(--late); border-color: transparent; color: #fff; }
  #dlgbox .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  #dlgbox .row > input { flex: 1; }
  #dlgbox .row select { width: auto; }
  #dlgbox .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
  #dlgbox .clist > div { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  #dlgbox .clist i { width: 14px; height: 14px; border-radius: 4px; background: var(--c); flex: none; }
  #dlgbox .clist b { flex: 1; }
  #dlgbox .clist button { padding: 6px 10px; }
  #dlgbox .muted { color: var(--muted); font-size: 14px; }
  .count { color: var(--muted); }
  .list { flex: 1; overflow-y: auto; padding: 10px; }
  .ticket { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--new);
    border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .ticket.picking { border-left-color: var(--picking); }
  .ticket.ready { border-left-color: var(--ready); }
  .ticket.late .timer { color: var(--late); font-weight: 700; }
  .ticket.flash { animation: flash 1s ease-in-out 3; }
  @keyframes flash { 50% { background: var(--flash); } }
  .thead { display: flex; justify-content: space-between; align-items: baseline; }
  .onum { font-size: 22px; font-weight: 800; }
  .timer { font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cust { margin: 4px 0 8px; font-size: 16px; color: var(--muted); }
  .cust b { color: var(--text); }
  .items { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .items li { display: flex; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .qty { min-width: 46px; font-size: 22px; font-weight: 800; color: var(--accent); }
  .iname { font-size: 18px; font-weight: 600; }
  .sku { font-size: 14px; color: var(--muted); font-family: ui-monospace, Menlo, Consolas, monospace; }
  .opt { font-size: 14px; color: var(--opt); }
  .note { margin-top: 8px; padding: 6px 8px; background: var(--notebg); color: var(--notetx); border-radius: 6px; font-size: 14px; }
  .actions { display: flex; margin-top: 10px; }
  .actions button { flex: 1; font-size: 17px; font-weight: 700; padding: 12px; border: 0; border-radius: 8px;
    color: #fff; background: var(--picking); cursor: pointer; }
  html[data-theme=dark] .actions button { color: #0b0d12; }
  .actions button + button { margin-left: 8px; flex: 0 0 auto; background: var(--btn); color: var(--text); font-weight: 600; }
  .ticket.picking .actions button:first-child { background: var(--ready); }
  .ticket.ready .actions button:first-child { background: var(--donebtn); color: var(--text); }
  .actions button.confirm { background: var(--late) !important; color: #fff; }
  .printed { font-size: 13px; color: var(--ready); margin-left: 8px; }
  .noprint { font-size: 13px; color: var(--late); margin-left: 8px; }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; }
  #clock, .bellbtn { white-space: nowrap; }
  .bellbtn { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; padding: 7px 12px;
    border-radius: 99px; border: 1px solid var(--line); background: var(--btn); color: var(--muted); cursor: pointer; }
  .bellbtn svg { width: 18px; height: 18px; }
  .bellbtn.on { background: var(--onbg); color: var(--ontx); border-color: var(--onb); }
  #alert { display: none; align-items: center; justify-content: center; gap: 14px; padding: 16px; cursor: pointer;
    background: var(--late); color: #fff; font-size: 24px; font-weight: 800; text-align: center; user-select: none; }
  #alert.show { display: flex; animation: alertflash 1s steps(2) infinite; }
  #alert small { font-size: 16px; font-weight: 600; opacity: .9; }
  #alert svg { width: 30px; height: 30px; animation: swing .5s ease-in-out infinite alternate; }
  @keyframes alertflash { 50% { background: #b91c1c; } }
  @keyframes swing { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
  body.alerting main { height: calc(100% - 56px - 66px); }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: center;
    justify-content: center; flex-direction: column; font-size: 22px; z-index: 9; cursor: pointer; text-align: center; padding: 20px; }
  #overlay small { color: var(--muted); font-size: 15px; margin-top: 10px; }
  #error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 20px; color: var(--late); background: var(--bg); text-align: center; padding: 20px; }
  .out { font-size: 14px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
  #adminbar { display: none; align-items: center; gap: 10px; padding: 8px 16px; background: #3b2a05; color: #fde68a; font-size: 15px; }
  #adminbar button { padding: 6px 12px; border: 0; border-radius: 8px; background: #fde68a; color: #3b2a05; font-weight: 700; cursor: pointer; }
  body.admin #adminbar { display: flex; }
  body.admin main { height: calc(100% - 56px - 42px); }
  body.admin.alerting main { height: calc(100% - 56px - 42px - 66px); }
  #error button { margin-top: 16px; font-size: 16px; padding: 10px 18px; border: 0; border-radius: 8px; cursor: pointer; }
  @media (max-width: 760px) {
    main { flex-direction: column; height: auto; }
    .col { border-right: 0; border-bottom: 1px solid var(--line); }
    .list { overflow: visible; }
    .meta > :not(#clock):not(#bellbtn) { display: none; }
    header { gap: 8px; } .brand { font-size: 18px; min-width: 0; } .meta > * { margin-left: 10px; }
    #clock { font-size: 18px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span data-brand></span><span class="dot" id="dot"></span><span id="sname">Loading…</span></div>
  <div class="meta">
    <button class="bellbtn" id="bellbtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span>Bell on</span></button>
    <button class="out" id="colsbtn" type="button" title="Columns after New">⚙ Columns</button>
    <button class="out" id="secbtn" type="button" title="Password, backup email, support access">🔒 Login</button>
    <span class="conn" id="conn"><i></i><span>Connecting</span></span>
    <span id="clock">--:--</span>
    <button class="out" id="outbtn" type="button" title="Sign out this screen">Sign out</button>
  </div>
</header>
<div id="adminbar">👁 Admin view of <b id="abname"></b><span style="flex:1"></span><button type="button" id="abback">← Back to admin</button></div>
<div id="alert" role="alert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span id="alerttext">New order</span><small>Tap to stop</small></div>
<main>
  <section class="col" data-s="new"><h2>New <span class="count" id="c-new">0</span></h2><div class="list" id="l-new"></div></section>
  <!-- columns after New: the store's own (⚙ Columns) -->
</main>
<div id="dlg" role="dialog"><form id="dlgbox" onsubmit="return false"></form></div>
<div id="overlay">Tap to start<small>Turns on the new-order bell</small></div>
<div id="error"></div>
<script src="/brand.js"></script>
<script src="/security-ui.js"></script>
<script>
// The sign-in page this screen came from (/login/store), so signing out goes back to it.
function hbLogin() { try { var p = localStorage.getItem('hb_login'); if (p && /^\/login(\/[a-z]+)?$/.test(p)) return p; } catch (e) { /* ok */ } return '/login'; }
</script>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var STORE = null; // this store's id, from the signed-in account
  var LATE_MIN = Number(qs.get('late') || 15);   // minutes before a ticket turns red
  var tickets = {}, printed = {}, store = null, audioCtx = null, confirmTimer = null;
  var cols = []; // the store's columns after New: [{id, name, color, buttons:[{label, place}]}]

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fail(msg, button) {
    $('error').style.display = 'flex'; $('error').style.flexDirection = 'column';
    $('error').innerHTML = '<div>' + esc(msg) + '</div>' + (button || '');
    $('overlay').style.display = 'none';
  }
  // Same-origin calls with this screen's sign-in.
  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    opts.credentials = 'same-origin';
    return fetch(path, opts).then(function (r) {
      if (r.status === 401) { location.href = hbLogin(); throw new Error('Please sign in'); }
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) { var e = new Error((d && d.error) || r.status); e.status = r.status; throw e; }
        return d;
      });
    });
  }
  function signOut() { api('/api/logout', { method: 'POST', body: '{}' }).then(function () { location.href = hbLogin(); }, function () { location.href = hbLogin(); }); }
  $('outbtn').onclick = function () { if (confirm('Sign out this screen?')) signOut(); };
  $('abback').onclick = function () { api('/api/admin/leave', { method: 'POST', body: '{}' }).then(function () { location.href = '/admin#store'; }); };

  $('overlay').onclick = function () {
    unlockAudio();
    $('overlay').style.display = 'none';
  };
  // ---- bell ----
  var BELL_KEY = 'storeBell', RING_EVERY_MS = 3000; // remembered per screen
  var bellOn = true, ringTimer = null, ringing = {}; // ringing: ticketId -> orderNumber
  try { bellOn = localStorage.getItem(BELL_KEY) !== 'off'; } catch (e) {}

  function unlockAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }
  function ding(at, freq) {
    // bell = fundamental + inharmonic partials with a fast attack and long decay
    [[1, 0.5], [2.76, 0.22], [5.4, 0.1]].forEach(function (p) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = freq * p[0];
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(p[1], at + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 1.2);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(at); o.stop(at + 1.25);
    });
  }
  function ringOnce() {
    if (!audioCtx || !bellOn) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var t = audioCtx.currentTime + 0.02;
    ding(t, 1046); ding(t + 0.35, 1318); ding(t + 0.7, 1046);
  }
  function updateAlert() {
    var ids = Object.keys(ringing);
    var el = $('alert');
    if (!ids.length) {
      el.classList.remove('show'); document.body.classList.remove('alerting');
      clearInterval(ringTimer); ringTimer = null;
      return;
    }
    $('alerttext').textContent = ids.length === 1
      ? 'New order #' + ringing[ids[0]]
      : ids.length + ' new orders: #' + ids.map(function (k) { return ringing[k]; }).join(', #');
    el.classList.add('show'); document.body.classList.add('alerting');
    if (bellOn && !ringTimer) { ringOnce(); ringTimer = setInterval(ringOnce, RING_EVERY_MS); }
    if (!bellOn) { clearInterval(ringTimer); ringTimer = null; }
  }
  function startRinging(t) { ringing[t.id] = t.orderNumber; updateAlert(); }
  function stopRinging(id) {
    if (id) delete ringing[id]; else ringing = {};
    updateAlert();
  }
  function renderBell() {
    var b = $('bellbtn');
    b.classList.toggle('on', bellOn);
    b.lastChild.textContent = bellOn ? 'Bell on' : 'Bell off';
    b.setAttribute('aria-pressed', bellOn ? 'true' : 'false');
  }
  $('bellbtn').onclick = function () {
    bellOn = !bellOn;
    try { localStorage.setItem(BELL_KEY, bellOn ? 'on' : 'off'); } catch (e) {}
    if (bellOn) unlockAudio();
    clearInterval(ringTimer); ringTimer = null;
    renderBell(); updateAlert();
  };
  $('alert').onclick = function () { unlockAudio(); stopRinging(); };
  renderBell();

  function elapsed(iso) {
    var s = Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 1000));
    var m = Math.floor(s / 60);
    return { m: m, text: (m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + ':' + ('0' + (s % 60)).slice(-2)) };
  }

  var NEXT = { 'new': ['picking', 'Start picking'], picking: ['ready', 'Ready'], ready: ['done', 'Picked up'] };

  // A card in one of the store's own columns (after New): move on, arrange, tag.
  function ccard(t, col, i, list) {
    var e = elapsed(t.createdAt), k = cols.indexOf(col), last = k === cols.length - 1;
    var items = t.items.map(function (it) {
      return '<li><span class="qty">' + esc(it.qty) + '×</span><div><div class="iname">' + esc(it.name) + '</div>' +
        '<div class="sku">#' + esc(it.sku || '—') + '</div>' +
        (it.options && it.options.length ? '<div class="opt">' + esc(it.options.join(' · ')) + '</div>' : '') + '</div></li>';
    }).join('');
    var printMark = store && store.printer ? (printed[t.id] ? '<span class="printed">✓ printed</span>' : '') : '<span class="noprint">no printer</span>';
    var flags = (col.buttons || []).map(function (b) {
      var on = (t.flags || []).indexOf(b.label) !== -1;
      return '<button type="button" class="' + (on ? 'on' : '') + '" data-id="' + esc(t.id) + '" data-flag="' + esc(b.label) + '">' + esc(b.label) + (b.place === 'top' ? ' ⬆' : b.place === 'bottom' ? ' ⬇' : '') + '</button>';
    }).join('');
    var id = esc(t.id);
    return '<div class="ticket cc ' + t.status + (e.m >= LATE_MIN && t.status !== 'ready' ? ' late' : '') + '" id="t-' + id + '" style="--cc:' + esc(col.color) + '">' +
      '<div class="thead"><span class="onum">#' + esc(t.orderNumber) + printMark + '</span><span class="timer" data-at="' + esc(t.createdAt) + '">' + e.text + '</span></div>' +
      '<div class="cust"><b>' + esc(t.customer.name) + '</b>' + (t.customer.phone ? ' · ' + esc(t.customer.phone) : '') + '</div>' +
      '<ul class="items">' + items + '</ul>' +
      (t.note ? '<div class="note">' + esc(t.note) + '</div>' : '') +
      (flags ? '<div class="flags">' + flags + '</div>' : '') +
      '<div class="actions">' + (last ? '<button data-id="' + id + '" data-next="done">Picked up</button>'
        : '<button data-id="' + id + '" data-tocol="' + cols[k + 1].id + '">' + esc(cols[k + 1].name) + ' ›</button>') +
      (store && store.printer ? '<button data-id="' + id + '" data-reprint="1">Reprint</button>' : '') + '</div>' +
      '<div class="ord"><button type="button" data-id="' + id + '" ' + (k > 0 ? 'data-tocol="' + cols[k - 1].id + '"' : 'disabled') + ' title="Back to ' + (k > 0 ? esc(cols[k - 1].name) : '') + '">‹ Back</button>' +
      '<button type="button" data-id="' + id + '" data-ord="up" title="Move up"' + (i === 0 ? ' disabled' : '') + '>▲</button>' +
      '<button type="button" data-id="' + id + '" data-ord="down" title="Move down"' + (i === list.length - 1 ? ' disabled' : '') + '>▼</button>' +
      '<button type="button" data-id="' + id + '" data-ord="top" title="To the top"' + (i === 0 ? ' disabled' : '') + '>⤒ Top</button></div></div>';
  }

  function card(t) {
    var e = elapsed(t.createdAt), next = NEXT[t.status];
    var items = t.items.map(function (it) {
      return '<li><span class="qty">' + esc(it.qty) + '×</span><div><div class="iname">' + esc(it.name) + '</div>' +
        '<div class="sku">#' + esc(it.sku || '—') + '</div>' +
        (it.options && it.options.length ? '<div class="opt">' + esc(it.options.join(' · ')) + '</div>' : '') + '</div></li>';
    }).join('');
    var printMark = store && store.printer ? (printed[t.id] ? '<span class="printed">✓ printed</span>' : '') : '<span class="noprint">no printer</span>';
    return '<div class="ticket ' + t.status + (e.m >= LATE_MIN && t.status !== 'ready' ? ' late' : '') + '" id="t-' + esc(t.id) + '">' +
      '<div class="thead"><span class="onum">#' + esc(t.orderNumber) + printMark + '</span><span class="timer" data-at="' + esc(t.createdAt) + '">' + e.text + '</span></div>' +
      '<div class="cust"><b>' + esc(t.customer.name) + '</b>' + (t.customer.phone ? ' · ' + esc(t.customer.phone) : '') + '</div>' +
      '<ul class="items">' + items + '</ul>' +
      (t.note ? '<div class="note">' + esc(t.note) + '</div>' : '') +
      '<div class="actions"><button data-id="' + esc(t.id) + '" data-next="' + next[0] + '">' + next[1] + '</button>' +
      (store && store.printer ? '<button data-id="' + esc(t.id) + '" data-reprint="1">Reprint</button>' : '') + '</div></div>';
  }

  function render() {
    var all = Object.keys(tickets).map(function (k) { return tickets[k]; });
    // New: exactly as before (oldest first, bell, alerts, Start picking)
    var list = all.filter(function (t) { return t.status === 'new'; }).sort(function (a, b) { return a.createdAt.localeCompare(b.createdAt); });
    $('c-new').textContent = list.length;
    $('l-new').innerHTML = list.length ? list.map(card).join('') : '<div class="empty">No orders</div>';
    // the store's own columns
    var main = document.querySelector('main');
    main.querySelectorAll('.col.cc').forEach(function (n) { n.remove(); });
    cols.forEach(function (c, k) {
      var mine = all.filter(function (t) {
        if (t.status !== 'picking' && t.status !== 'ready') return false;
        var cid = cols.some(function (x) { return x.id === t.columnId; }) ? t.columnId : (t.status === 'ready' ? cols[cols.length - 1].id : cols[0].id);
        return cid === c.id;
      }).sort(function (a, b) { return ((a.sortPos == null ? 1e15 : a.sortPos) - (b.sortPos == null ? 1e15 : b.sortPos)) || a.createdAt.localeCompare(b.createdAt); });
      var sec = document.createElement('section');
      sec.className = 'col cc'; sec.style.setProperty('--cc', c.color);
      sec.innerHTML = '<h2><span>' + esc(c.name) + '</span><span style="flex:1"></span><span class="count">' + mine.length + '</span><button type="button" class="gear" data-colset="' + c.id + '" title="Column settings">⚙</button></h2>' +
        '<div class="list">' + (mine.length ? mine.map(function (t, i) { return ccard(t, c, i, mine); }).join('') : '<div class="empty">No orders</div>') + '</div>';
      main.appendChild(sec);
    });
  }

  document.addEventListener('click', function (ev) {
    var g = ev.target.closest('[data-colset]');
    if (g) return colDialog(Number(g.getAttribute('data-colset')));
    var b = ev.target.closest('button[data-id]');
    if (!b || b.disabled) return;
    var id = b.getAttribute('data-id');
    var post = function (path, body) {
      b.disabled = true;
      return api('/api/store/tickets/' + encodeURIComponent(id) + path, { method: 'POST', body: JSON.stringify(body) })
        .then(function (u) { if (u && u.id) upsert(u); }, function (e) { b.disabled = false; alert(e.message || 'Could not update — check the connection.'); });
    };
    if (b.getAttribute('data-tocol')) return post('/column', { column_id: Number(b.getAttribute('data-tocol')) });
    if (b.getAttribute('data-ord')) return post('/order', { action: b.getAttribute('data-ord') });
    if (b.getAttribute('data-flag')) return post('/flag', { label: b.getAttribute('data-flag') });
    if (b.getAttribute('data-reprint')) {
      b.textContent = 'Sending…';
      api('/api/store/tickets/' + encodeURIComponent(id) + '/reprint', { method: 'POST', body: '{}' })
        .then(function () { b.textContent = 'Sent'; }, function () { b.textContent = 'Failed'; });
      return;
    }
    var next = b.getAttribute('data-next');
    if (next === 'done' && !b.classList.contains('confirm')) {
      b.classList.add('confirm'); b.textContent = 'Tap again to confirm';
      clearTimeout(confirmTimer);
      confirmTimer = setTimeout(render, 4000);
      return;
    }
    b.disabled = true;
    api('/api/store/tickets/' + encodeURIComponent(id) + '/status', { method: 'POST', body: JSON.stringify({ status: next }) })
      .then(upsert, function () { b.disabled = false; alert('Could not update — check the connection.'); });
  });

  var seen = {}, firstLoad = true;
  function upsert(t) {
    var isNew = !seen[t.id] && t.status === 'new';
    seen[t.id] = true;
    if (['new', 'picking', 'ready'].indexOf(t.status) === -1) delete tickets[t.id];
    else tickets[t.id] = t;
    if (t.status !== 'new' && ringing[t.id]) stopRinging(t.id); // picked up by staff = acknowledged
    render();
    if (isNew) {
      startRinging(t);
      var el = $('t-' + t.id); if (el) el.classList.add('flash');
    }
  }

  function load() {
    return api('/api/store/tickets').then(function (list) {
      tickets = {};
      list.forEach(function (t) {
        var missed = !firstLoad && !seen[t.id] && t.status === 'new';
        seen[t.id] = true;
        if (['new', 'picking', 'ready'].indexOf(t.status) !== -1) tickets[t.id] = t;
        if (missed) ringing[t.id] = t.orderNumber;
        if (ringing[t.id] && t.status !== 'new') delete ringing[t.id];
      });
      firstLoad = false;
      render(); updateAlert();
    });
  }

  // Live feed for this account: new orders, status changes from other screens, "printed", and admin changes.
  function connect() {
    var es = new EventSource('/api/events');
    es.onopen = function () {
      $('conn').className = 'conn ok'; $('conn').lastChild.textContent = 'Live';
      load(); // catch anything missed while disconnected
    };
    es.onerror = function () { $('conn').className = 'conn'; $('conn').lastChild.textContent = 'Reconnecting'; };
    es.onmessage = function (e) {
      var m = JSON.parse(e.data);
      if (m.type === 'ticket' && m.ticket) upsert(m.ticket);
      else if (m.type === 'printed') { printed[m.ticketId] = true; render(); }
      else if (m.type === 'storecols') loadCols().then(render);
      else if (m.type === 'account') location.reload(); // switched off, renamed or changed by the admin
    };
  }

  // ---------- the store's columns after New (⚙ Columns) ----------
  function loadCols() { return api('/api/store/columns').then(function (c) { cols = c; }); }
  function openDlg(html) { $('dlgbox').innerHTML = html; $('dlg').classList.add('open'); return $('dlgbox'); }
  function closeDlg() { $('dlg').classList.remove('open'); }
  $('dlg').addEventListener('mousedown', function (e) { if (e.target.id === 'dlg') closeDlg(); });
  function call(path, method, body) { return api(path, { method: method, body: JSON.stringify(body || {}) }); }
  function colsDialog() {
    var f = openDlg('<h3>⚙ Columns</h3><div class="muted">New stays first, with the bell and alerts. These are the columns after it; the last one finishes orders (Picked up). Tap ✏️ to change a column’s name, color and buttons; ← → to move it.</div>' +
      '<div class="clist"><div><i style="--c:var(--new)"></i><b>New</b><span class="muted">always first</span></div>' +
      cols.map(function (c, k) {
        return '<div><i style="--c:' + esc(c.color) + '"></i><b>' + esc(c.name) + (k === cols.length - 1 ? ' <span class="muted">(finishes orders)</span>' : '') + '</b>' +
          '<button type="button" data-mv="-1" data-c="' + c.id + '"' + (k === 0 ? ' disabled' : '') + ' title="Move left">←</button>' +
          '<button type="button" data-mv="1" data-c="' + c.id + '"' + (k === cols.length - 1 ? ' disabled' : '') + ' title="Move right">→</button>' +
          '<button type="button" data-ed="' + c.id + '">✏️</button></div>';
      }).join('') + '</div>' +
      (cols.length < 6 ? '<div class="row"><input id="ncName" maxlength="30" placeholder="New column name, e.g. Bagging"><button type="button" class="pri" id="ncAdd">+ Add</button></div>' : '') +
      '<div class="acts"><button type="button" id="dlgDone">Done</button></div>');
    f.onclick = function (e) {
      var t = e.target.closest('button'); if (!t || t.disabled) return;
      if (t.id === 'dlgDone') return closeDlg();
      if (t.getAttribute('data-ed')) return colDialog(Number(t.getAttribute('data-ed')));
      if (t.getAttribute('data-mv')) return call('/api/store/columns/' + t.getAttribute('data-c') + '/move', 'POST', { direction: Number(t.getAttribute('data-mv')) }).then(loadCols).then(function () { render(); colsDialog(); }, function (er) { alert(er.message); });
      if (t.id === 'ncAdd') {
        var n = $('ncName').value.trim(); if (!n) return $('ncName').focus();
        return call('/api/store/columns', 'POST', { name: n }).then(loadCols).then(function () { render(); colsDialog(); }, function (er) { alert(er.message); });
      }
    };
    var nc = $('ncName'); if (nc) nc.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); $('ncAdd').click(); } };
  }
  function colDialog(id) {
    var c = cols.filter(function (x) { return x.id === id; })[0]; if (!c) return;
    var btnRow = function (b) {
      return '<div class="row brow"><input maxlength="24" placeholder="Button name, e.g. Rush" value="' + esc(b ? b.label : '') + '">' +
        '<select><option value="">stays put</option><option value="top"' + (b && b.place === 'top' ? ' selected' : '') + '>moves card to top ⬆</option><option value="bottom"' + (b && b.place === 'bottom' ? ' selected' : '') + '>moves card to bottom ⬇</option></select>' +
        '<button type="button" data-rm="1" title="Remove">✕</button></div>';
    };
    var f = openDlg('<h3>Column: ' + esc(c.name) + '</h3>' +
      '<label>Name</label><input id="cdName" maxlength="30" value="' + esc(c.name) + '">' +
      '<label>Color</label><input id="cdColor" type="color" value="' + esc(c.color) + '">' +
      '<label>Buttons on its orders <span class="muted">(up to 4; tap one on an order to turn it on or off)</span></label><div id="cdBtns">' + (c.buttons || []).map(btnRow).join('') + '</div>' +
      '<button type="button" id="cdAddBtn" style="margin-top:8px">+ Add a button</button>' +
      '<div class="acts"><button type="button" class="del" id="cdDel" style="margin-right:auto">Remove column</button><button type="button" id="cdBack">Cancel</button><button type="button" class="pri" id="cdSave">Save</button></div>');
    f.onclick = function (e) {
      var t = e.target.closest('button'); if (!t) return;
      if (t.getAttribute('data-rm')) { t.closest('.brow').remove(); return; }
      if (t.id === 'cdAddBtn') { if (f.querySelectorAll('.brow').length >= 4) return alert('Up to 4 buttons per column'); $('cdBtns').insertAdjacentHTML('beforeend', btnRow(null)); return; }
      if (t.id === 'cdBack') return colsDialog();
      if (t.id === 'cdSave') {
        var buttons = [].map.call(f.querySelectorAll('.brow'), function (r) { return { label: r.querySelector('input').value.trim(), place: r.querySelector('select').value || null }; }).filter(function (x) { return x.label; });
        return call('/api/store/columns/' + c.id, 'PUT', { name: $('cdName').value, color: $('cdColor').value, buttons: buttons }).then(loadCols).then(function () { render(); closeDlg(); }, function (er) { alert(er.message); });
      }
      if (t.id === 'cdDel') {
        if (!confirm('Remove the column "' + c.name + '"? Its orders move to the next column over.')) return;
        return call('/api/store/columns/' + c.id, 'DELETE').then(loadCols).then(function () { render(); colsDialog(); }, function (er) { alert(er.message); });
      }
    };
  }
  $('colsbtn').onclick = colsDialog;
  $('secbtn').onclick = function () { HBSec.loginDialog({ owner: true, place: 'store' }); };

  function tick() {
    $('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    var nodes = document.querySelectorAll('.timer[data-at]');
    for (var i = 0; i < nodes.length; i++) {
      var e = elapsed(nodes[i].getAttribute('data-at'));
      nodes[i].textContent = e.text;
      var tk = nodes[i].closest('.ticket');
      if (e.m >= LATE_MIN && !tk.classList.contains('ready')) tk.classList.add('late');
    }
  }
  tick(); setInterval(tick, 1000);

  api('/api/me').then(function (me) {
    var th = me.account && me.account.theme === 'dark' ? 'dark' : 'ranch'; document.documentElement.dataset.theme = th; try { localStorage.setItem('hb_theme', th); } catch (e) { /* ok */ }
    if (me.admin) {
      document.body.classList.add('admin'); $('abname').textContent = me.household.name + ' (Store Orders)' + (me.account.active ? '' : ' · SWITCHED OFF');
      $('outbtn').style.display = 'none'; $('overlay').style.display = 'none'; $('secbtn').style.display = 'none';
      if (me.acting_until) $('abname').insertAdjacentHTML('afterend', ' · as support until <b>' + new Date(me.acting_until).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '</b>');
    } else if (me.needs_backup) HBSec.backupBar(document.querySelector('header'), { owner: true, place: 'store' });
    return api('/api/store/info');
  }).then(function (s) {
    store = s; STORE = s.id;
    $('sname').textContent = s.name; document.title = s.name + ' · Orders';
    $('dot').style.background = s.color || '';
    document.documentElement.style.setProperty('--accent', s.color || '#f59e0b');
    renderBell();
    return loadCols().then(connect);
  }, function (e) {
    if (/switched off/.test(e.message)) {
      setTimeout(function () { location.reload(); }, 30000); // comes back by itself when switched on again
      return fail('⏸ This store is switched off. Contact the administrator. This screen comes back by itself when it is switched on again.',
        '<button type="button" onclick="this.disabled=true;fetch(\'/api/logout\',{method:\'POST\'}).then(function(){location.href=hbLogin()})">Sign out</button>');
    }
    fail(e.message || 'This screen could not load.');
  });
})();
</script>
</body>
</html>
