<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Orders</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --card: #1f232c; --line: #2c313c;
    --text: #eef1f6; --muted: #8b93a3; --accent: #f59e0b;
    --new: #3b82f6; --picking: #f59e0b; --ready: #22c55e; --late: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; font-size: 22px; font-weight: 700; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); margin-right: 10px; }
  .meta { display: flex; align-items: center; color: var(--muted); font-size: 16px; }
  .meta > * { margin-left: 18px; }
  #clock { color: var(--text); font-size: 22px; font-variant-numeric: tabular-nums; }
  .conn { display: inline-flex; align-items: center; }
  .conn i { width: 10px; height: 10px; border-radius: 50%; background: var(--late); margin-right: 6px; }
  .conn.ok i { background: var(--ready); }
  main { display: flex; height: calc(100% - 56px); }
  .col { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--line); min-width: 0; }
  .col:last-child { border-right: 0; }
  .col h2 { margin: 0; padding: 10px 14px; font-size: 16px; letter-spacing: .08em; text-transform: uppercase;
    display: flex; justify-content: space-between; border-bottom: 3px solid var(--line); }
  .col[data-s=new] h2 { border-color: var(--new); }
  .col[data-s=picking] h2 { border-color: var(--picking); }
  .col[data-s=ready] h2 { border-color: var(--ready); }
  .count { color: var(--muted); }
  .list { flex: 1; overflow-y: auto; padding: 10px; }
  .ticket { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--new);
    border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .ticket.picking { border-left-color: var(--picking); }
  .ticket.ready { border-left-color: var(--ready); }
  .ticket.late .timer { color: var(--late); font-weight: 700; }
  .ticket.flash { animation: flash 1s ease-in-out 3; }
  @keyframes flash { 50% { background: #2a3550; } }
  .thead { display: flex; justify-content: space-between; align-items: baseline; }
  .onum { font-size: 22px; font-weight: 800; }
  .timer { font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cust { margin: 4px 0 8px; font-size: 16px; color: var(--muted); }
  .cust b { color: var(--text); }
  .items { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .items li { display: flex; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .qty { min-width: 46px; font-size: 22px; font-weight: 800; color: var(--accent); }
  .iname { font-size: 18px; font-weight: 600; }
  .sku { font-size: 14px; color: var(--muted); font-family: ui-monospace, Menlo, Consolas, monospace; }
  .opt { font-size: 14px; color: #c9d1de; }
  .note { margin-top: 8px; padding: 6px 8px; background: #2b2410; color: #fcd34d; border-radius: 6px; font-size: 14px; }
  .actions { display: flex; margin-top: 10px; }
  .actions button { flex: 1; font-size: 17px; font-weight: 700; padding: 12px; border: 0; border-radius: 8px;
    color: #0b0d12; background: var(--picking); cursor: pointer; }
  .actions button + button { margin-left: 8px; flex: 0 0 auto; background: #2d3340; color: var(--text); font-weight: 600; }
  .ticket.picking .actions button:first-child { background: var(--ready); }
  .ticket.ready .actions button:first-child { background: #e5e7eb; }
  .actions button.confirm { background: var(--late) !important; color: #fff; }
  .printed { font-size: 13px; color: var(--ready); margin-left: 8px; }
  .noprint { font-size: 13px; color: var(--late); margin-left: 8px; }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; }
  .bellbtn { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; padding: 7px 12px;
    border-radius: 99px; border: 1px solid var(--line); background: #2d3340; color: var(--muted); cursor: pointer; }
  .bellbtn svg { width: 18px; height: 18px; }
  .bellbtn.on { background: #123320; color: #86efac; border-color: #1f6b3d; }
  #alert { display: none; align-items: center; justify-content: center; gap: 14px; padding: 16px; cursor: pointer;
    background: var(--late); color: #fff; font-size: 24px; font-weight: 800; text-align: center; user-select: none; }
  #alert.show { display: flex; animation: alertflash 1s steps(2) infinite; }
  #alert small { font-size: 16px; font-weight: 600; opacity: .9; }
  #alert svg { width: 30px; height: 30px; animation: swing .5s ease-in-out infinite alternate; }
  @keyframes alertflash { 50% { background: #b91c1c; } }
  @keyframes swing { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
  body.alerting main { height: calc(100% - 56px - 66px); }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: center;
    justify-content: center; flex-direction: column; font-size: 22px; z-index: 9; cursor: pointer; text-align: center; padding: 20px; }
  #overlay small { color: var(--muted); font-size: 15px; margin-top: 10px; }
  #error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 20px; color: var(--late); background: var(--bg); text-align: center; padding: 20px; }
  @media (max-width: 760px) {
    main { flex-direction: column; height: auto; }
    .col { border-right: 0; border-bottom: 1px solid var(--line); }
    .list { overflow: visible; }
    .meta > :not(#clock):not(#bellbtn) { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot" id="dot"></span><span id="sname">Loading…</span></div>
  <div class="meta">
    <button class="bellbtn" id="bellbtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span>Bell on</span></button>
    <span class="conn" id="conn"><i></i><span>Connecting</span></span>
    <span id="clock">--:--</span>
  </div>
</header>
<div id="alert" role="alert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span id="alerttext">New order</span><small>Tap to stop</small></div>
<main>
  <section class="col" data-s="new"><h2>New <span class="count" id="c-new">0</span></h2><div class="list" id="l-new"></div></section>
  <section class="col" data-s="picking"><h2>Picking <span class="count" id="c-picking">0</span></h2><div class="list" id="l-picking"></div></section>
  <section class="col" data-s="ready"><h2>Ready for pickup <span class="count" id="c-ready">0</span></h2><div class="list" id="l-ready"></div></section>
</main>
<div id="overlay">Tap to start<small>Turns on the new-order bell</small></div>
<div id="error"></div>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var STORE = qs.get('store'), KEY = qs.get('key');
  var LATE_MIN = Number(qs.get('late') || 15);   // minutes before a ticket turns red
  var tickets = {}, printed = {}, store = null, audioCtx = null, confirmTimer = null;

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fail(msg) { $('error').style.display = 'flex'; $('error').textContent = msg; }
  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'Content-Type': 'application/json', 'x-key': KEY }, opts.headers || {});
    return fetch(path, opts).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
  }

  if (!STORE || !KEY) return fail('This screen link is missing its store or key. Copy the link from the master screen.');

  $('overlay').onclick = function () {
    unlockAudio();
    $('overlay').style.display = 'none';
  };
  // ---- bell ----
  var BELL_KEY = 'storeBell:' + STORE, RING_EVERY_MS = 3000;
  var bellOn = true, ringTimer = null, ringing = {}; // ringing: ticketId -> orderNumber
  try { bellOn = localStorage.getItem(BELL_KEY) !== 'off'; } catch (e) {}

  function unlockAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }
  function ding(at, freq) {
    // bell = fundamental + inharmonic partials with a fast attack and long decay
    [[1, 0.5], [2.76, 0.22], [5.4, 0.1]].forEach(function (p) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = freq * p[0];
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(p[1], at + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 1.2);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(at); o.stop(at + 1.25);
    });
  }
  function ringOnce() {
    if (!audioCtx || !bellOn) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var t = audioCtx.currentTime + 0.02;
    ding(t, 1046); ding(t + 0.35, 1318); ding(t + 0.7, 1046);
  }
  function updateAlert() {
    var ids = Object.keys(ringing);
    var el = $('alert');
    if (!ids.length) {
      el.classList.remove('show'); document.body.classList.remove('alerting');
      clearInterval(ringTimer); ringTimer = null;
      return;
    }
    $('alerttext').textContent = ids.length === 1
      ? 'New order #' + ringing[ids[0]]
      : ids.length + ' new orders: #' + ids.map(function (k) { return ringing[k]; }).join(', #');
    el.classList.add('show'); document.body.classList.add('alerting');
    if (bellOn && !ringTimer) { ringOnce(); ringTimer = setInterval(ringOnce, RING_EVERY_MS); }
    if (!bellOn) { clearInterval(ringTimer); ringTimer = null; }
  }
  function startRinging(t) { ringing[t.id] = t.orderNumber; updateAlert(); }
  function stopRinging(id) {
    if (id) delete ringing[id]; else ringing = {};
    updateAlert();
  }
  function renderBell() {
    var b = $('bellbtn');
    b.classList.toggle('on', bellOn);
    b.lastChild.textContent = bellOn ? 'Bell on' : 'Bell off';
    b.setAttribute('aria-pressed', bellOn ? 'true' : 'false');
  }
  $('bellbtn').onclick = function () {
    bellOn = !bellOn;
    try { localStorage.setItem(BELL_KEY, bellOn ? 'on' : 'off'); } catch (e) {}
    if (bellOn) unlockAudio();
    clearInterval(ringTimer); ringTimer = null;
    renderBell(); updateAlert();
  };
  $('alert').onclick = function () { unlockAudio(); stopRinging(); };
  renderBell();

  function elapsed(iso) {
    var s = Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 1000));
    var m = Math.floor(s / 60);
    return { m: m, text: (m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + ':' + ('0' + (s % 60)).slice(-2)) };
  }

  var NEXT = { 'new': ['picking', 'Start picking'], picking: ['ready', 'Ready'], ready: ['done', 'Picked up'] };

  function card(t) {
    var e = elapsed(t.createdAt), next = NEXT[t.status];
    var items = t.items.map(function (it) {
      return '<li><span class="qty">' + esc(it.qty) + '×</span><div><div class="iname">' + esc(it.name) + '</div>' +
        '<div class="sku">#' + esc(it.sku || '—') + '</div>' +
        (it.options && it.options.length ? '<div class="opt">' + esc(it.options.join(' · ')) + '</div>' : '') + '</div></li>';
    }).join('');
    var printMark = store && store.printer ? (printed[t.id] ? '<span class="printed">✓ printed</span>' : '') : '<span class="noprint">no printer</span>';
    return '<div class="ticket ' + t.status + (e.m >= LATE_MIN && t.status !== 'ready' ? ' late' : '') + '" id="t-' + esc(t.id) + '">' +
      '<div class="thead"><span class="onum">#' + esc(t.orderNumber) + printMark + '</span><span class="timer" data-at="' + esc(t.createdAt) + '">' + e.text + '</span></div>' +
      '<div class="cust"><b>' + esc(t.customer.name) + '</b>' + (t.customer.phone ? ' · ' + esc(t.customer.phone) : '') + '</div>' +
      '<ul class="items">' + items + '</ul>' +
      (t.note ? '<div class="note">' + esc(t.note) + '</div>' : '') +
      '<div class="actions"><button data-id="' + esc(t.id) + '" data-next="' + next[0] + '">' + next[1] + '</button>' +
      (store && store.printer ? '<button data-id="' + esc(t.id) + '" data-reprint="1">Reprint</button>' : '') + '</div></div>';
  }

  function render() {
    ['new', 'picking', 'ready'].forEach(function (s) {
      var list = Object.keys(tickets).map(function (k) { return tickets[k]; })
        .filter(function (t) { return t.status === s; })
        .sort(function (a, b) { return a.createdAt.localeCompare(b.createdAt); });
      $('c-' + s).textContent = list.length;
      $('l-' + s).innerHTML = list.length ? list.map(card).join('') : '<div class="empty">No orders</div>';
    });
  }

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-id]');
    if (!b) return;
    var id = b.getAttribute('data-id');
    if (b.getAttribute('data-reprint')) {
      b.textContent = 'Sending…';
      api('/api/tickets/' + encodeURIComponent(id) + '/reprint', { method: 'POST', body: '{}' })
        .then(function () { b.textContent = 'Sent'; }, function () { b.textContent = 'Failed'; });
      return;
    }
    var next = b.getAttribute('data-next');
    if (next === 'done' && !b.classList.contains('confirm')) {
      b.classList.add('confirm'); b.textContent = 'Tap again to confirm';
      clearTimeout(confirmTimer);
      confirmTimer = setTimeout(render, 4000);
      return;
    }
    b.disabled = true;
    api('/api/tickets/' + encodeURIComponent(id) + '/status', { method: 'POST', body: JSON.stringify({ status: next }) })
      .then(upsert, function () { b.disabled = false; alert('Could not update — check the connection.'); });
  });

  var seen = {}, firstLoad = true;
  function upsert(t) {
    var isNew = !seen[t.id] && t.status === 'new';
    seen[t.id] = true;
    if (['new', 'picking', 'ready'].indexOf(t.status) === -1) delete tickets[t.id];
    else tickets[t.id] = t;
    if (t.status !== 'new' && ringing[t.id]) stopRinging(t.id); // picked up by staff = acknowledged
    render();
    if (isNew) {
      startRinging(t);
      var el = $('t-' + t.id); if (el) el.classList.add('flash');
    }
  }

  function load() {
    return api('/api/tickets?store=' + encodeURIComponent(STORE)).then(function (list) {
      tickets = {};
      list.forEach(function (t) {
        var missed = !firstLoad && !seen[t.id] && t.status === 'new';
        seen[t.id] = true;
        if (['new', 'picking', 'ready'].indexOf(t.status) !== -1) tickets[t.id] = t;
        if (missed) ringing[t.id] = t.orderNumber;
        if (ringing[t.id] && t.status !== 'new') delete ringing[t.id];
      });
      firstLoad = false;
      render(); updateAlert();
    });
  }

  function connect() {
    var es = new EventSource('/stream?store=' + encodeURIComponent(STORE) + '&key=' + encodeURIComponent(KEY));
    es.onopen = function () {
      $('conn').className = 'conn ok'; $('conn').lastChild.textContent = 'Live';
      load(); // catch anything missed while disconnected
    };
    es.onerror = function () { $('conn').className = 'conn'; $('conn').lastChild.textContent = 'Reconnecting'; };
    es.addEventListener('ticket', function (e) { upsert(JSON.parse(e.data)); });
    es.addEventListener('printed', function (e) {
      var d = JSON.parse(e.data); printed[d.ticketId] = true; render();
    });
  }

  setInterval(function () {
    $('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    var nodes = document.querySelectorAll('.timer[data-at]');
    for (var i = 0; i < nodes.length; i++) {
      var e = elapsed(nodes[i].getAttribute('data-at'));
      nodes[i].textContent = e.text;
      var tk = nodes[i].closest('.ticket');
      if (e.m >= LATE_MIN && !tk.classList.contains('ready')) tk.classList.add('late');
    }
  }, 1000);

  api('/api/store-info?store=' + encodeURIComponent(STORE)).then(function (s) {
    store = s;
    $('sname').textContent = s.name; document.title = s.name + ' · Orders';
    $('dot').style.background = s.color || '';
    document.documentElement.style.setProperty('--accent', s.color || '#f59e0b');
    if (s.display === false) return fail('The screen is turned off for this store in stores.json.');
    connect();
  }, function () { fail('This screen link is not valid. Copy the link again from the master screen.'); });
})();
</script>
</body>
</html>
