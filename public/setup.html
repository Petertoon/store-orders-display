<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem('hb_theme') || 'ranch'; } catch (e) { document.documentElement.dataset.theme = 'ranch'; }</script>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#d9c093"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<form class="auth" id="f">
  <h1>🛠 First-time setup</h1>
  <div class="muted">This runs once and makes <b>your admin sign-in</b>. On the admin page you then make the accounts
    (Mama's To-Do, Papa's Shop, Store Orders), each with its own sign-in.</div>
  <label for="email">Your email</label>
  <input id="email" type="email" autocomplete="username" required>
  <label for="pw">Password (8 or more characters)</label>
  <input id="pw" type="password" autocomplete="new-password" minlength="8" required>
  <button class="primary" type="submit">Create admin sign-in</button>
  <div class="err" id="err"></div>
</form>
<script src="/app.js"></script>
<script>
api('/api/setup-status').then((s) => { if (!s.needs_setup) location.href = '/login'; }).catch(() => {});
$('#f').addEventListener('submit', async (e) => {
  e.preventDefault(); $('#err').textContent = '';
  try {
    await api('/api/setup', { email: $('#email').value, password: $('#pw').value });
    location.href = '/admin';
  } catch (err) { $('#err').textContent = err.message; }
});
</script>
</body>
</html>
