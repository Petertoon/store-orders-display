<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>HomeBoard</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0f172a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
  .top { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #0f172a; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .top .brand { font-weight: 800; font-size: 20px; white-space: nowrap; display: flex; align-items: center; }
  .top .spacer { flex: 1; }
  .top input, .top select { width: auto; padding: 8px 10px; background: var(--card); }
  .top #search { width: 200px; }
  .top label.check { margin: 0; color: var(--muted); font-size: 13px; }
  button.dk { background: #1e2a44; border: 1px solid var(--line); }
  button.dk.on, button[data-keys].on { background: #2c4a86; border-color: #5b8cff; }
  .mebtn { display: flex; align-items: center; gap: 8px; background: #1e2a44; border: 1px solid var(--line); }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--mc, #64748b); display: inline-block; flex: none; }
  #clock { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .counts { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 14px 0; }
  .counts span { border: 1px solid var(--c, var(--line)); border-radius: 7px; padding: 3px 9px; font-size: 13px; font-weight: 700; background: #111a2c; }

  /* board */
  #board { display: flex; gap: 10px; padding: 10px 14px 18px; overflow-x: auto; align-items: flex-start; min-height: calc(100vh - 110px); padding-bottom: calc(18px + var(--oskh, 0px)); }
  .col { flex: 1 1 0; min-width: 250px; background: var(--colbg, var(--panel)); color: var(--cardtx, var(--ink)); border-radius: 10px; display: flex; flex-direction: column; max-height: calc(100vh - 125px); }
  .col.drop { outline: 2px dashed #8cb4ff; }
  .colhead { background: var(--c); color: var(--ht, #fff); border-radius: 10px 10px 0 0; padding: 10px 12px; display: flex; align-items: center; gap: 6px; }
  .colhead div { flex: 1; min-width: 0; }
  .colhead b { display: block; font-size: 16px; letter-spacing: .02em; }
  .colhead small { opacity: .9; font-size: 12.5px; }
  .colhead button { background: rgba(0,0,0,.18); color: inherit; padding: 4px 10px; font-size: 18px; line-height: 1.2; }
  .cards { padding: 8px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  .empty { opacity: .6; text-align: center; padding: 16px 0; font-size: 14px; }
  .tc { background: var(--cardbg, var(--card)); color: var(--cardtx, var(--ink)); border-radius: 9px; border-left: 4px solid var(--c); padding: 9px 10px 10px; cursor: pointer; position: relative; user-select: none; }
  .tc:hover { filter: brightness(1.1); }
  .tc.dragging { opacity: .4; }
  .tc .t { font-weight: 800; font-size: 16px; padding-right: 30px; line-height: 1.3; word-break: break-word; }
  .tc .d { opacity: .8; font-size: 13.5px; line-height: 1.35; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tc .m { font-size: 13.5px; line-height: 1.5; margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .tc .who { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; }
  .tc .late { color: #ff6b6b; font-weight: 800; } .tc .soon { color: #fbbf24; font-weight: 800; } .tc .ok { color: #34d399; font-weight: 800; }
  .flag { background: #7f1d1d; color: #fecaca; font-size: 11.5px; font-weight: 800; border-radius: 5px; padding: 2px 6px; }
  .bar { height: 6px; background: rgba(127,127,127,.3); border-radius: 9px; overflow: hidden; margin-top: 5px; }
  .bar i { display: block; height: 100%; background: #4ade80; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { border: 1.5px solid var(--b); color: var(--b); background: transparent; padding: 5px 11px; font-size: 13px; border-radius: 7px; font-weight: 800; }
  .chip.on { background: var(--b); color: #0b1220; }
  .nx { position: absolute; right: 6px; top: 6px; background: rgba(127,127,127,.25); color: inherit; padding: 2px 10px; font-size: 18px; border-radius: 6px; }

  /* to-do ticket (opens over the board) */
  .ticket { position: fixed; top: 0; left: 0; right: 0; bottom: var(--oskh, 0px); z-index: 40; display: flex; flex-direction: column; background: var(--colbg, var(--bg)); }
  .thead { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--c, #0f172a); color: var(--ht, #fff); flex-wrap: wrap; }
  .thead > button, .thead select { background: rgba(0,0,0,.25); color: inherit; border: 1px solid rgba(255,255,255,.3); width: auto; }
  .thead select option { color: #000; }
  .thead .chip:not(.on) { background: rgba(11,18,32,.85); }
  .thead .spacer { flex: 1; }
  #saveState { font-size: 13.5px; font-weight: 700; opacity: .9; min-width: 70px; text-align: right; }
  .tgrid { flex: 1; display: grid; grid-template-columns: 1fr 360px; gap: 10px; padding: 10px 14px; min-height: 0; }
  .pane { background: var(--panel); border-radius: 10px; padding: 14px; overflow-y: auto; min-height: 0; min-width: 0; border-top: 4px solid var(--c, transparent); }
  /* The main ticket panel takes the column's card colors. */
  #tMain { background: var(--cardbg, var(--panel)); color: var(--cardtx, var(--ink)); }
  #tMain label, #tMain h3 small { color: inherit; opacity: .75; }
  .pane h3 { margin: 18px 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .05em; opacity: .85; }
  .pane h3:first-child { margin-top: 0; }
  .fld { position: relative; display: flex; gap: 6px; align-items: flex-start; }
  .fld textarea, .fld input { flex: 1; min-width: 0; resize: vertical; background: rgba(127,127,127,.14); color: inherit; border-color: rgba(127,127,127,.4); }
  #tTitle { font-size: 24px; font-weight: 800; resize: none; overflow: hidden; line-height: 1.3; padding: 10px 12px; }
  #tNotes { min-height: 130px; line-height: 1.45; }
  .mic { flex: none; width: 48px; height: 46px; padding: 0; font-size: 20px; background: rgba(127,127,127,.25); color: inherit; }
  .mic.listening { background: #dc2626; color: #fff; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(220,38,38,.35); } }
  .nomic .mic, .nomic .key.off { display: none; }
  .steps { display: flex; flex-direction: column; gap: 6px; }
  .step { display: flex; align-items: center; gap: 8px; background: rgba(127,127,127,.13); border-radius: 8px; padding: 4px 6px 4px 10px; }
  .step input[type=checkbox] { width: 26px; height: 26px; flex: none; accent-color: #22c55e; cursor: pointer; }
  .step input[type=text] { flex: 1; min-width: 0; background: transparent; border-color: transparent; color: inherit; padding: 8px 6px; }
  .step input[type=text]:focus { background: rgba(127,127,127,.18); border-color: rgba(127,127,127,.4); }
  .step.done input[type=text] { text-decoration: line-through; opacity: .6; }
  .step .x { background: transparent; color: #ff8a8a; font-size: 22px; padding: 2px 10px; }
  .addstep { margin-top: 8px; }
  .addstep button.primary { height: 46px; }
  .side label { margin-top: 16px; }
  .side label:first-child { margin-top: 0; }
  .pick { display: flex; flex-wrap: wrap; gap: 6px; }
  .pick button { padding: 9px 13px; display: inline-flex; align-items: center; gap: 7px; background: #1e2a44; border: 2px solid transparent; }
  .pick button.on { border-color: var(--mc, #5b8cff); background: #24345a; }
  .side input[type=date] { margin-top: 6px; color-scheme: dark; }
  .hist div { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; color: #c3cee6; }
  .hist small { color: var(--muted); display: block; }

  /* admin viewing an account */
  .adminbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 14px; background: #3b2a05; color: #fde68a; font-size: 14.5px; }
  .adminbar button { padding: 6px 12px; background: #fde68a; color: #3b2a05; }
  .adminbar .off { background: #7f1d1d; color: #fecaca; border-radius: 6px; padding: 2px 8px; font-weight: 800; }
  /* shop jobs: job number and customer */
  .jn { opacity: .65; font-weight: 700; margin-right: 6px; }
  .cgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  #custBox label { margin-top: 10px; }
  a.linkbtn { display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; text-decoration: none; }
  a.linkbtn.off { opacity: .35; pointer-events: none; }
  .fullmsg { max-width: 560px; margin: 12vh auto; background: var(--panel); border-radius: 14px; padding: 28px; text-align: center; }
  .fullmsg h2 { margin: 0 0 10px; }

  /* Papa's Shop: parts & charges, totals, payments */
  #moneyBox { margin-top: 6px; margin-bottom: 8px; }
  .partadd { margin-top: 4px; }
  .partadd button { flex: none; height: 46px; white-space: nowrap; }
  .sug { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .sug button { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; background: rgba(127,127,127,.18); color: inherit; padding: 9px 12px; }
  .sug small, .ln small, .prow small { display: block; opacity: .7; font-weight: 500; font-size: 12.5px; }
  .chargef, .payf { background: rgba(127,127,127,.12); border-radius: 10px; padding: 10px; margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
  .crow { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
  .crow label { margin: 0; flex: 1; min-width: 110px; font-size: 13px; color: inherit; opacity: .9; }
  .crow label.check { flex: none; min-width: 0; margin-bottom: 10px; }
  .crow input[type=text] { margin-top: 3px; background: rgba(0,0,0,.18); color: inherit; }
  .lines { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
  .lgh { font-size: 12.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; opacity: .75; margin-top: 8px; }
  .lgh.up { color: #f59e0b; opacity: 1; }
  .line { display: grid; grid-template-columns: 1fr 58px 12px 82px 90px auto auto; gap: 6px; align-items: center; background: rgba(127,127,127,.13); border-radius: 8px; padding: 6px 6px 6px 10px; }
  .line input { padding: 6px 6px; text-align: right; background: rgba(0,0,0,.18); color: inherit; border-color: rgba(127,127,127,.35); }
  .line .lx { opacity: .6; text-align: center; } .line .lt { text-align: right; }
  .line .uc { padding: 5px 8px; font-size: 12px; background: transparent; border: 1.5px solid rgba(127,127,127,.6); color: inherit; }
  .line .uc.on { border-color: #f59e0b; color: #f59e0b; }
  .line .lr, .tots .pr { background: transparent; color: #ff8a8a; font-size: 20px; padding: 2px 8px; }
  .tots { margin: 10px 0 0 auto; max-width: 380px; display: flex; flex-direction: column; gap: 2px; font-size: 15px; }
  .tots > div { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 2px 0; }
  .tots .upt { color: #f59e0b; } .tots .big { font-size: 19px; font-weight: 800; border-top: 1px solid rgba(127,127,127,.4); padding-top: 6px; margin-top: 4px; }
  .tots .pay span { flex: 1; } .tots small { opacity: .65; } .tots .due b { color: #fbbf24; } .tots .paid { color: #34d399; }
  .invb { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .invb button { flex: 1; min-width: 120px; background: rgba(127,127,127,.22); color: inherit; }
  .plist { max-height: 46vh; overflow-y: auto; margin-top: 8px; }
  .prow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .prow > div { flex: 1; min-width: 0; } .prow button { padding: 6px 10px; }
  #custLink { font-size: 13.5px; margin-top: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #custLink button { padding: 5px 10px; font-size: 13px; background: rgba(127,127,127,.22); color: inherit; }
  .qbline { margin-top: 10px; font-size: 13.5px; opacity: .9; }
  .qbline.err { color: #fca5a5; opacity: 1; } .qbline.ok { color: #86efac; opacity: 1; }
  .sendgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .sendgrid button { padding: 14px 8px; font-size: 16px; }
  .sendgrid .wa { background: #1fa855; color: #fff; }
  .clist { max-height: 50vh; overflow-y: auto; margin-top: 8px; }
  .crow2 { display: flex; align-items: center; gap: 8px; padding: 9px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .crow2:hover { background: rgba(127,127,127,.1); }
  .crow2 > div { flex: 1; min-width: 0; } .crow2 small { display: block; color: var(--muted); }
  .qbst { background: #0f1729; border-radius: 10px; padding: 10px 12px; margin-top: 8px; font-size: 14px; line-height: 1.5; }
  .qr { background: #fff; border-radius: 12px; padding: 12px; width: 260px; margin: 0 auto; }
  .qr svg { width: 100%; height: auto; display: block; }

  /* "who are you?" */
  .whobox { position: fixed; inset: 0; z-index: 80; background: rgba(5,9,18,.94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 20px; }
  .whobox h2 { margin: 0; font-size: 28px; }
  .whobox .people { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 900px; }
  .whobox .people button { min-width: 150px; padding: 22px 20px; font-size: 22px; border-radius: 14px; background: #18233a; border: 3px solid var(--mc); display: flex; align-items: center; gap: 12px; justify-content: center; }
  .whobox .people .dot { width: 20px; height: 20px; }

  /* dialogs */
  .modal-back { bottom: var(--oskh, 0px); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .presets button { padding: 5px 10px; font-size: 13px; }
  .btnset { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; margin-top: 8px; }
  .btnset .row { display: grid; grid-template-columns: auto 1fr 52px; gap: 8px; align-items: center; }
  .btnset .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .btnset .row2 label { margin: 0; font-size: 12.5px; color: var(--muted); } .btnset .row2 select { margin-top: 2px; }
  .colors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .colors div { background: #0f1729; border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .colors span { width: 100%; font-weight: 700; font-size: 13px; }
  .colors small { width: 100%; color: var(--muted); font-size: 11.5px; }
  .colors input[type=color] { width: 46px; height: 34px; }
  .collist div { display: flex; align-items: center; gap: 6px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .collist div b { flex: 1; }
  .collist i { width: 14px; height: 14px; border-radius: 4px; background: var(--c); display: inline-block; flex: none; }
  .collist button { padding: 6px 10px; }
  .addrow { display: flex; gap: 6px; }
  .mrow { display: grid; grid-template-columns: 52px 1fr auto auto; gap: 6px; align-items: center; margin-top: 6px; }
  .mrow button { padding: 8px 10px; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0 6px; }

  /* on-screen keyboard */
  #osk { position: fixed; left: 0; right: 0; bottom: 0; z-index: 250; background: #0a1020; border-top: 1px solid var(--line); padding: 8px 6px 10px; user-select: none; touch-action: manipulation; }
  #osk .krow { display: flex; gap: 6px; justify-content: center; margin-top: 6px; max-width: 1100px; margin-left: auto; margin-right: auto; }
  #osk .key { flex: 1 1 0; min-width: 0; height: 58px; padding: 0; font-size: 22px; font-weight: 600; background: #24314f; border-radius: 8px; color: #fff; }
  #osk .key.mod { flex: 1.4 1 0; font-size: 17px; background: #182238; }
  #osk .key.space { flex: 5 1 0; font-size: 15px; color: var(--muted); }
  #osk .key.enter { flex: 1.6 1 0; background: #2563eb; }
  #osk .key.on, #osk .key.caps { background: #5b8cff; }
  #osk .key.down { filter: brightness(1.6); }

  /* Papa's Shop: three columns like ContractorPOS (add parts | job ticket | totals & details) */
  .tgrid.shop3 { grid-template-columns: 290px 1fr 350px; }
  #tLeft h3 { margin-top: 0; }
  .addrow2 { display: flex; gap: 6px; }
  .addrow2 #partQ { flex: 1; min-width: 0; border: 2px solid #22c55e; background: #0f1729; }
  .addrow2 #partQty { width: 58px; flex: none; text-align: center; }
  .bigbtn { width: 100%; margin-top: 8px; padding: 13px; font-size: 15.5px; background: #1e2a44; }
  .plistL { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .plistL button { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; background: #1e2a44; padding: 11px 12px; border-radius: 9px; }
  .plistL button b { white-space: nowrap; }
  .plistL small { display: block; color: var(--muted); font-weight: 500; font-size: 12.5px; }
  #moneySide .tots { margin: 0; max-width: none; }
  #moneySide .invb { flex-direction: column; } #moneySide .invb button { min-width: 0; }
  #moneySide .payf { margin-top: 10px; }
  #moneySide + #tSide { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
  @media (max-width: 1250px) { .tgrid.shop3 { grid-template-columns: 250px 1fr 300px; } }
  @media (max-width: 1000px) { .tgrid { grid-template-columns: 1fr 300px; } .tgrid.shop3 { grid-template-columns: 230px 1fr 280px; } }
  @media (max-width: 760px) {
    .line { display: flex; flex-wrap: wrap; } .line .ln { width: 100%; } .line .lq { width: 62px; } .line .lp { width: 90px; } .line .lt { flex: 1; text-align: right; }
    .cgrid { grid-template-columns: 1fr; }
    .top { gap: 6px; padding: 8px; } .top .brand { font-size: 18px; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top #search { order: 10; width: 100%; } .top #whoSel { flex: 1; } .top .spacer { display: none; } #clock { display: none; } .top label.check { display: none; } .hide-sm { display: none; }
    #board { min-height: auto; scroll-snap-type: x mandatory; padding: 8px; } .col { min-width: 86vw; scroll-snap-align: center; max-height: none; }
    .ticket { overflow-y: auto; } .tgrid, .tgrid.shop3 { grid-template-columns: 1fr; flex: none; padding: 8px; } .pane { overflow: visible; }
    #tMain { order: 1; } #tLeft { order: 2; } #sideWrap { order: 3; } .plistL { max-height: 300px; overflow-y: auto; }
    .thead { padding: 8px; } .thead .chips { order: 5; width: 100%; } #tTitle { font-size: 20px; }
    #osk .key { height: 46px; font-size: 18px; } #osk .krow { gap: 4px; margin-top: 5px; }
    .btnset .row2 { grid-template-columns: 1fr; } .whobox .people button { min-width: 42vw; padding: 18px 12px; font-size: 19px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span data-brand></span><span id="bIcon">🏠</span> <span id="house"></span></div>
  <button class="primary" id="newTodo">+ New to-do</button>
  <input id="search" type="search" placeholder="Search to-dos…" autocomplete="off">
  <select id="whoSel" aria-label="Whose to-dos"></select>
  <label class="check"><input type="checkbox" id="allDone"> Older done</label>
  <div class="spacer"></div>
  <button class="dk" data-keys title="On-screen keyboard (for touchscreens)">⌨<span class="hide-sm"> Keyboard</span></button>
  <button class="dk" id="setupBtn">⚙<span class="hide-sm"> Board setup</span></button>
  <button class="dk" id="partsBtn" hidden>🔩<span class="hide-sm"> Parts</span></button>
  <button class="dk" id="scanBtn" hidden>📷<span class="hide-sm"> Scanner</span></button>
  <button class="dk" id="custBtn" hidden>👥<span class="hide-sm"> Customers</span></button>
  <button class="dk" id="qboBtn" hidden><span id="qboDot">📊</span><span class="hide-sm"> QuickBooks</span></button>
  <button class="dk" id="familyBtn"><span id="pIcon">👪</span><span class="hide-sm" id="pLabel"> Family</span></button>
  <button class="mebtn" id="meBtn" title="Switch person"><i class="dot"></i><span>Who?</span></button>
  <span id="clock"></span>
</header>
<div class="adminbar" id="adminBar" hidden>👁 Admin view of <b id="abName"></b> <span id="abOff"></span><span style="flex:1"></span><button type="button" id="abBack">← Back to admin</button></div>
<div class="counts" id="counts"></div>
<main id="board"></main>

<div class="ticket" id="ticket" hidden>
  <div class="thead" id="tHead"></div>
  <div class="tgrid">
    <div class="pane" id="tLeft" hidden></div>
    <div class="pane" id="tMain">
      <div class="fld"><textarea id="tTitle" rows="1" maxlength="200" placeholder="What needs doing?"></textarea><button type="button" class="mic" data-mic="tTitle" title="Talk to type">🎤</button></div>
      <div id="custBox" hidden>
        <div class="cgrid">
          <div><label for="tCust">Customer</label><div class="fld"><input id="tCust" type="text" maxlength="120" placeholder="Name (type to pick from the customer list)" autocomplete="off"><button type="button" class="mic" data-mic="tCust" title="Talk to type">🎤</button></div>
            <div class="sug" id="custSug" hidden></div></div>
          <div><label for="tPhone">Phone</label><div class="fld"><input id="tPhone" type="tel" maxlength="40" placeholder="Phone" autocomplete="off"><a class="mic linkbtn" id="tCall" title="Call">📞</a></div></div>
        </div>
        <div id="custLink"></div>

        <label for="tAddr">Address</label><div class="fld"><input id="tAddr" type="text" maxlength="300" placeholder="Where" autocomplete="off"><a class="mic linkbtn" id="tMap" target="_blank" rel="noopener" title="Open in maps">🗺</a></div>

      <div class="fld"><textarea id="tNotes" rows="5" maxlength="10000" placeholder="Details: where, what to get, who to call…"></textarea><button type="button" class="mic" data-mic="tNotes" title="Talk to type">🎤</button></div>
      <h3>Checklist <small id="stepCount"></small></h3>
      <div class="steps" id="steps"></div>

<div class="whobox" id="who" hidden></div>

<script src="/app.js"></script>
<script src="/keys.js"></script>
<script src="/shop-ui.js"></script>
<script src="/brand.js"></script>
<script>
const SCREEN = Math.random().toString(36).slice(2, 10); // tells this screen's own saves apart from other screens'
let me = null, cols = [], todos = [], members = [], openId = null, cur = null;
// Words for each kind of screen.
const WORDS = {
  todo: { one: 'to-do', many: 'to-dos', One: 'To-do', icon: '🏠', people: 'Family', pIcon: '👪', title: 'What needs doing?', place: 'house' },
  shop: { one: 'job', many: 'jobs', One: 'Job', icon: '🔧', people: 'Crew', pIcon: '👷', title: 'Job: what needs doing?', place: 'shop' },
};
let W = WORDS.todo, isShop = false;
const plural = (n) => `${n} ${n === 1 ? W.one : W.many}`;
const memberById = (id) => members.find((m) => m.id === id) || null;
const firstLine = (s) => String(s || '').split('\n').map((x) => x.trim()).find(Boolean) || '';
const shortDate = (d) => (d ? new Date(d.length === 10 ? d + 'T12:00:00' : d).toLocaleDateString([], { month: 'short', day: 'numeric' }) : '');
const when = (d) => new Date(d).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const addDays = (n, from = new Date()) => { const d = new Date(from); d.setDate(d.getDate() + n); return isoDay(d); };
async function run(fn) { try { return await fn(); } catch (e) { toast(e.message, 'bad'); return null; } }

// ---------- dialogs ----------
function openModal(html) {
  const mb = $('#mBody'); mb.onclick = mb.oninput = mb.onchange = null;
  mb.innerHTML = html;
  $('#m').classList.add('open');
  return mb;
}
function closeModal() { $('#m').classList.remove('open'); $('#mBody').innerHTML = ''; }
$('#m').addEventListener('mousedown', (e) => { if (e.target.id === 'm') closeModal(); });
// A yes/no question in our own dialog (bigger than the browser's, and works with the on-screen keyboard).
function ask(question, yes = 'Yes', danger = false) {
  return new Promise((resolve) => {
    const f = openModal(`<h2 style="font-size:20px">${esc(question)}</h2><div class="actions">
      <button type="button" data-a="0">Cancel</button><button type="button" class="${danger ? 'danger' : 'primary'}" data-a="1">${esc(yes)}</button></div>`);
    f.onclick = (e) => { const b = e.target.closest('[data-a]'); if (!b) return; closeModal(); resolve(b.dataset.a === '1'); };
  });
}
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if ($('#m').classList.contains('open')) closeModal(); else if (!$('#ticket').hidden) closeTicket();
});

// ---------- who are you? ----------
function whoPicker() {
  const box = $('#who');
  box.innerHTML = `<h2>Who's using this screen?</h2><div class="people">${members.map((m) =>
    `<button data-m="${m.id}" style="--mc:${m.color}"><i class="dot"></i>${esc(m.name)}</button>`).join('')}</div>
    <div class="muted">Your name goes on what you add and change. Tap your name at the top to switch.</div>
    ${me.member ? '<button class="dk" data-m="0">Cancel</button>' : ''}`;
  box.hidden = false;
  box.onclick = (e) => {
    const b = e.target.closest('[data-m]'); if (!b) return;
    if (b.dataset.m === '0') { box.hidden = true; return; }
    run(async () => {
      me.member = await api('/api/me/member', { member_id: Number(b.dataset.m) });
      box.hidden = true; showMe(); toast(`Hi ${me.member.name}!`);
      if (cur) renderSide();
    });
  };
}
function showMe() {
  if (me.admin) { $('#meBtn').hidden = true; return; }
  $('#meBtn').style.setProperty('--mc', me.member ? me.member.color : '#64748b');
  $('#meBtn span').textContent = me.member ? me.member.name : 'Who?';
}
$('#meBtn').onclick = whoPicker;

// ---------- board ----------
async function loadBoard() {
  const d = await api('/api/board' + ($('#allDone').checked ? '?done=all' : ''));
  if (isShop) await Shop.loadSummary().catch(() => {});
  cols = d.columns; todos = d.todos; members = d.members;
  fillWhoSel();
  renderBoard();
}
function fillWhoSel() {
  const v = $('#whoSel').value;
  $('#whoSel').innerHTML = `<option value="">Everyone</option>${me.member ? '<option value="mine">Mine</option>' : ''}` +
    members.map((m) => `<option value="${m.id}">${esc(m.name)}</option>`).join('') + '<option value="none">For anyone</option>';
  if ([...$('#whoSel').options].some((o) => o.value === v)) $('#whoSel').value = v;
}
function matches(t) {
  const v = $('#whoSel').value;
  if (v === 'mine' && !(me.member && t.member_id === me.member.id)) return false;
  if (v === 'none' && t.member_id) return false;
  if (/^\d+$/.test(v) && t.member_id !== Number(v)) return false;
  const q = $('#search').value.trim().toLowerCase();
  return !q || [t.title, t.notes, t.customer_name, t.customer_phone, t.job_address, t.job_number && String(t.job_number)]
    .some((s) => (s || '').toLowerCase().includes(q.replace(/^#/, '')));
}
// Due date words for a card or ticket.
function dueHtml(d, done) {
  if (!d || done) return '';
  const today = isoDay();
  if (d < today) return `<span class="late">⚠ Overdue · ${shortDate(d)}</span>`;
  if (d === today) return '<span class="soon">📅 Due today</span>';
  if (d === addDays(1)) return '<span class="soon">📅 Due tomorrow</span>';
  return `<span>📅 Due ${shortDate(d)}</span>`;
}
function card(t, c, i) {
  const btns = (c.buttons || []).map((b, k) => ({ ...b, k })).filter((b) => b.enabled);
  const last = i === cols.length - 1, next = cols[i + 1];
  const m = memberById(t.member_id);
  const title = t.title || firstLine(t.notes) || t.customer_name || '(no title)';
  const sub = t.title ? firstLine(t.notes) : '';
  const meta = [];
  if (isShop && t.customer_name && t.customer_name !== title) meta.push(`<span>👤 ${esc(t.customer_name)}</span>`);
  if (m) meta.push(`<span class="who"><i class="dot" style="--mc:${m.color}"></i>${esc(m.name)}</span>`);
  if (t.priority === 'high') meta.push('<span class="flag">⚑ High</span>');
  const due = dueHtml(t.due_date, last); if (due) meta.push(due);
  if (t.steps) meta.push(`<span>☑ ${t.steps_done}/${t.steps}</span>`);
  if (isShop) { const mm = Shop.cardMeta(t); if (mm) meta.push(mm); }
  if (last && t.done_at) meta.push(`<span class="ok">✓ Done ${shortDate(t.done_at)}</span>`);
  return `<div class="tc" draggable="true" data-todo="${t.id}">
    <div class="t">${t.job_number ? `<span class="jn">#${t.job_number}</span>` : ''}${esc(title)}</div>
    ${!last && next ? `<button class="nx" data-next="${t.id}" title="Move to ${esc(next.name)}">›</button>` : ''}
    ${sub ? `<div class="d">${esc(sub)}</div>` : ''}
    ${meta.length ? `<div class="m">${meta.join('')}</div>` : ''}
    ${t.steps && !last ? `<div class="bar"><i style="width:${Math.round((100 * t.steps_done) / t.steps)}%"></i></div>` : ''}
    ${btns.length ? `<div class="chips">${btns.map((b) => `<button class="chip ${t.status_label === b.label ? 'on' : ''}" style="--b:${b.color || '#3b82f6'}" data-btn="${b.k}" data-tid="${t.id}">${esc(b.label)}</button>`).join('')}</div>` : ''}
  </div>`;
}
// Cards sort themselves: by the place of the button they're marked with (top, middle, bottom), then high priority,
// then the soonest due date, then the longest in the column. Done: newest first.
const PLACE_RANK = { top: 0, middle: 1, bottom: 2 };
const colVars = (c) => `--c:${c.color};` + [['--ht', c.text_color], ['--colbg', c.bg_color], ['--cardbg', c.card_color], ['--cardtx', c.card_text_color]]
  .filter(([, v]) => v).map(([k, v]) => `${k}:${v};`).join('');
function sortCards(list, c, last) {
  if (last) return list.slice().sort((a, b) => String(b.done_at || '').localeCompare(String(a.done_at || '')));
  const rank = (t) => { const b = (c.buttons || []).find((x) => x.enabled && x.label === t.status_label); return PLACE_RANK[(b && b.place) || 'middle']; };
  return list.map((t, i) => ({ t, i })).sort((a, b) => rank(a.t) - rank(b.t)
    || (b.t.priority === 'high') - (a.t.priority === 'high')
    || (a.t.due_date || '9999').localeCompare(b.t.due_date || '9999') || a.i - b.i).map((x) => x.t);
}
function renderBoard() {
  const shown = todos.filter(matches);
  $('#counts').innerHTML = `<span>${shown.length} Total</span>` +
    cols.map((c) => `<span style="--c:${c.color}">${shown.filter((t) => t.column_id === c.id).length} ${esc(c.name)}</span>`).join('');
  $('#board').innerHTML = cols.map((c, i) => {
    const last = i === cols.length - 1;
    const list = sortCards(shown.filter((t) => t.column_id === c.id), c, last);
    return `<section class="col" data-col="${c.id}" style="${colVars(c)}">
      <div class="colhead"><div><b>${esc(c.name.toUpperCase())}</b><small>${plural(list.length)}</small></div>
        <button data-add="${c.id}" title="New ${W.one} in ${esc(c.name)}">+</button><button data-gear="${c.id}" title="Column settings">⚙</button></div>
      <div class="cards">${list.map((t) => card(t, c, i)).join('') || `<div class="empty">${last ? 'Nothing done yet' : 'Nothing here'}</div>`}</div></section>`;
  }).join('');
}
$('#board').addEventListener('click', (e) => {
  const g = e.target.closest('[data-gear]'); if (g) return columnSettings(Number(g.dataset.gear));
  const a = e.target.closest('[data-add]'); if (a) return newTicket(Number(a.dataset.add));
  const nx = e.target.closest('[data-next]');
  if (nx) { e.stopPropagation(); return run(async () => { await api(`/api/todos/${nx.dataset.next}/move`, { direction: 1 }); await loadBoard(); }); }
  const b = e.target.closest('[data-btn]');
  if (b) {
    e.stopPropagation();
    return run(async () => {
      const r = await api(`/api/todos/${b.dataset.tid}/button`, { index: Number(b.dataset.btn) });
      if (r.moved) toast('Moved to the next column');
      await loadBoard();
    });
  }
  const c = e.target.closest('[data-todo]');
  if (c) openTicket(Number(c.dataset.todo));
});
// Drag a card to any column (mouse). On touch screens use › or the column list on the ticket.
let dragId = null;
$('#board').addEventListener('dragstart', (e) => {
  const c = e.target.closest('[data-todo]'); if (!c) return;
  dragId = Number(c.dataset.todo); c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move';
});
$('#board').addEventListener('dragend', () => { dragId = null; $$('.dragging, .drop').forEach((x) => x.classList.remove('dragging', 'drop')); });
$('#board').addEventListener('dragover', (e) => {
  const col = e.target.closest('[data-col]'); if (!col || !dragId) return;
  e.preventDefault(); $$('.drop').forEach((x) => x !== col && x.classList.remove('drop')); col.classList.add('drop');
});
$('#board').addEventListener('drop', (e) => {
  const col = e.target.closest('[data-col]'); if (!col || !dragId) return;
  e.preventDefault();
  const id = dragId, t = todos.find((x) => x.id === id);
  if (t && t.column_id === Number(col.dataset.col)) return;
  run(async () => { await api(`/api/todos/${id}/move`, { column_id: Number(col.dataset.col) }); await loadBoard(); });
});
$('#search').addEventListener('input', renderBoard);
$('#whoSel').addEventListener('change', renderBoard);
$('#allDone').addEventListener('change', () => run(loadBoard));
$('#newTodo').onclick = () => newTicket(cols[0] && cols[0].id);

// ---------- the to-do ticket: everything is typed (or spoken) right here and saves as you go ----------
let pending = {}, saveTimer = null, saveChain = Promise.resolve();
let saveState = '';
function setState(st) {
  saveState = st;
  const el = $('#saveState'); if (!el) return;
  el.textContent = { typing: '…', saving: 'Saving…', saved: 'Saved ✓', error: 'Not saved ⚠', '': '' }[st] ?? st;
}
// A blank ticket. It is only created on the server once something is typed into it.
function newTicket(columnId) {
  const v = $('#whoSel').value;
  const forWho = v === 'mine' && me.member ? me.member.id : (/^\d+$/.test(v) ? Number(v) : null);
  cur = { id: null, column_id: columnId || cols[0].id, title: '', notes: '', member_id: forWho, due_date: null, priority: 'normal',
    customer_name: '', customer_phone: '', job_address: '',
    status_label: null, steps: [], history: [] };
  openId = null;
  showTicket();
  setTimeout(() => $('#tTitle').focus(), 50);
}
async function openTicket(id) {
  openId = id;
  history.replaceState(null, '', '#todo-' + id);
  const t = await run(() => api('/api/todos/' + id));
  if (!t) { openId = null; history.replaceState(null, '', location.pathname); return; }
  cur = t;
  showTicket();
}
function showTicket() {
  $('#ticket').hidden = false;
  $('#tTitle').value = cur.title; $('#tNotes').value = cur.notes; $('#newStep').value = '';
  $('#tCust').value = cur.customer_name || ''; $('#tPhone').value = cur.customer_phone || ''; $('#tAddr').value = cur.job_address || '';
  $('#tEmail').value = cur.customer_email || '';
  custLinks();
  fitTitle();
  saveState = '';
  renderTicket();
  if (isShop) { Shop.reset(); Shop.render(); Shop.loadMoney().catch(() => {}); }
}
async function closeTicket() {
  Voice.stop();
  await flush();
  // A step typed but not added yet gets added, so nothing typed is lost.
  if ($('#newStep').value.trim()) await addStep();
  openId = null; cur = null; $('#ticket').hidden = true;
  if (isShop) Shop.target(null);
  if (document.activeElement) document.activeElement.blur();
  Keys.hide();
  history.replaceState(null, '', location.pathname);
  run(loadBoard);
}
async function refreshTicket() {
  if (!cur || !cur.id) return;
  const t = await api('/api/todos/' + cur.id);
  if (!cur || cur.id !== t.id) return;
  // Keep what's being typed on this screen; take everything else from the server.
  for (const k of Object.keys(pending)) t[k] = pending[k];
  cur = t;
  if (document.activeElement !== $('#tTitle') && !('title' in pending)) { $('#tTitle').value = t.title; fitTitle(); }
  if (document.activeElement !== $('#tNotes') && !('notes' in pending)) $('#tNotes').value = t.notes;
  for (const [id, k] of CUST) if (document.activeElement !== $(id) && !(k in pending)) $(id).value = t[k] || '';
  custLinks();
  renderTicket();
  if (isShop) await Shop.loadMoney().catch(() => {});
}
function colOf(t) { return cols.find((c) => c.id === t.column_id) || t.column || cols[0]; }
function renderTicket() {
  const t = cur, c = colOf(t);
  const i = cols.findIndex((x) => x.id === c.id);
  $('#ticket').setAttribute('style', colVars(c));
  const btns = (c.buttons || []).map((b, k) => ({ ...b, k })).filter((b) => b.enabled);
  $('#tHead').innerHTML = `<button type="button" id="tBack">← Board</button>${t.job_number ? `<b style="font-size:18px">#${t.job_number}</b>` : ''}
    <select id="tCol" aria-label="Column">${cols.map((x) => `<option value="${x.id}" ${x.id === c.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
    <div class="chips" style="margin:0">${btns.map((b) => `<button type="button" class="chip ${t.status_label === b.label ? 'on' : ''}" style="--b:${b.color || '#3b82f6'}" data-tbtn="${b.k}">${esc(b.label)}</button>`).join('')}</div>
    <div class="spacer"></div><span id="saveState"></span>
    ${i > 0 ? '<button type="button" id="tPrev" title="Move back a column">‹</button>' : ''}
    ${i < cols.length - 1 ? `<button type="button" id="tNext" title="Move to ${esc(cols[i + 1].name)}">${esc(cols[i + 1].name)} ›</button>` : ''}
    ${isShop ? '<button type="button" id="tScan" title="Pair a phone as the barcode scanner">📷</button>' : ''}
    <button type="button" data-keys class="${Keys.isOn() ? 'on' : ''}" title="On-screen keyboard">⌨</button>
    ${t.id ? `<button type="button" id="tDel" title="Delete this ${W.one}">🗑</button>` : ''}`;
  setState(saveState); // the header was redrawn
  if (isShop) Shop.target(t.id); // the paired phone scanner adds to the job open here
  renderSteps();
  renderSide();
}
// The right-hand panel: who it's for, due date, priority, history.
function renderSide() {
  const t = cur;
  // "This weekend" is today on Saturday or Sunday, otherwise the coming Saturday.
  const dow = new Date().getDay(), today = isoDay(), sat = addDays(dow === 0 || dow === 6 ? 0 : 6 - dow);
  $('#tSide').innerHTML = `
    <label>For</label>
    <div class="pick" id="pickWho"><button type="button" data-who="" class="${t.member_id ? '' : 'on'}">👥 Anyone</button>${members.map((m) =>
      `<button type="button" data-who="${m.id}" class="${t.member_id === m.id ? 'on' : ''}" style="--mc:${m.color}"><i class="dot" style="--mc:${m.color}"></i>${esc(m.name)}</button>`).join('')}</div>
    <label>Due ${t.due_date ? `· <span style="font-weight:700">${dueHtml(t.due_date, false).replace(/<[^>]+>/g, '') || shortDate(t.due_date)}</span>` : ''}</label>
    <div class="pick" id="pickDue">
      <button type="button" data-due="${today}" class="${t.due_date === today ? 'on' : ''}">Today</button>
      <button type="button" data-due="${addDays(1)}" class="${t.due_date === addDays(1) ? 'on' : ''}">Tomorrow</button>
      <button type="button" data-due="${sat}" class="${t.due_date === sat ? 'on' : ''}">This weekend</button>
      <button type="button" data-due="${addDays(7)}" class="${t.due_date === addDays(7) ? 'on' : ''}">Next week</button>
      ${t.due_date ? '<button type="button" data-due="">✕ No date</button>' : ''}</div>
    <input type="date" id="dueDate" value="${t.due_date || ''}" aria-label="Pick a due date">
    <label>Priority</label>
    <div class="pick" id="pickPri"><button type="button" data-pri="normal" class="${t.priority !== 'high' ? 'on' : ''}">Normal</button>
      <button type="button" data-pri="high" class="${t.priority === 'high' ? 'on' : ''}" style="--mc:#ef4444">⚑ High</button></div>
    ${t.id ? `<h3>History</h3><div class="hist">${(t.history || []).map((h) => `<div>${esc(h.action)}<small>${esc(h.member_name || 'Someone')} · ${when(h.created_at)}</small></div>`).join('')}</div>`
      : `<p class="muted" style="margin-top:20px;font-size:14px">Type what needs doing. It saves by itself.</p>`}`;
}
// Saving: typing is collected for a moment, then saved. Saves go one after another.
function queue(key, value) {
  pending[key] = value; cur[key] = value;
  setState('typing');
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700);
}
function flush() {
  clearTimeout(saveTimer);
  const t = cur, body = pending; pending = {};
  if (!t || (!Object.keys(body).length && t.id)) return saveChain;
  saveChain = saveChain.then(() => save(t, body)).catch((e) => { toast(e.message, 'bad'); setState('error'); });
  return saveChain;
}
async function save(t, body) {
  if (!t.id) {
    if (!hasContent(t)) { setState(''); return; }
    setState('saving');
    const r = await api('/api/todos', newBody(t));
    t.id = r.id;
    if (cur === t) { openId = r.id; history.replaceState(null, '', '#todo-' + r.id); await refreshTicket(); }
  } else {
    if (!Object.keys(body).length) return;
    setState('saving');
    await api('/api/todos/' + t.id, { ...body, screen: SCREEN }, 'PATCH');
  }
  if (cur === t) setState('saved');
}
const hasContent = (t) => [t.title, t.notes, t.customer_name].some((x) => (x || '').trim());
const newBody = (t) => ({ title: t.title, notes: t.notes, member_id: t.member_id, due_date: t.due_date, priority: t.priority, column_id: t.column_id,
  customer_id: t.customer_id || null,
  customer_name: t.customer_name || '', customer_phone: t.customer_phone || '', job_address: t.job_address || '' });
// Makes sure the to-do / job exists on the server (for buttons, moving, steps).
async function ensureSaved() {
  await flush();
  if (!cur.id) throw new Error('Type what needs doing first');
}
// Shop jobs: customer, phone (tap to call) and address (open in maps), saved as you type.
const CUST = [['#tCust', 'customer_name'], ['#tPhone', 'customer_phone'], ['#tAddr', 'job_address'], ['#tEmail', 'customer_email']];
for (const [id, k] of CUST) {
  $(id).addEventListener('input', () => { queue(k, $(id).value); custLinks(); });
  $(id).addEventListener('blur', flush);
}
function custLinks() {
  const ph = $('#tPhone').value.trim(), ad = $('#tAddr').value.trim();
  $('#tCall').href = ph ? 'tel:' + ph.replace(/[^\d+]/g, '') : '#'; $('#tCall').classList.toggle('off', !ph);

// ---------- checklist ----------
let stepsStale = false;
const stepTimers = {};
function renderSteps() {
  const t = cur;
  // Don't redraw under someone typing in a step; redraw when they leave it.
  if (document.activeElement && document.activeElement.matches('#steps input[type=text]')) { stepsStale = true; return; }
  stepsStale = false;
  const n = t.steps.length, d = t.steps.filter((s) => s.done).length;
  $('#stepCount').textContent = n ? `${d} of ${n} done` : '';
  $('#steps').innerHTML = t.steps.map((s) => `<div class="step ${s.done ? 'done' : ''}" data-sid="${s.id}">
      <input type="checkbox" ${s.done ? 'checked' : ''} aria-label="Done">
      <input type="text" id="step-${s.id}" maxlength="300" value="${esc(s.text)}">
      <button type="button" class="mic" data-mic="step-${s.id}" title="Talk to type" style="width:42px;height:40px;font-size:17px">🎤</button>
      <button type="button" class="x" title="Remove step">×</button></div>`).join('');
}
async function addStep() {
  const v = $('#newStep').value.trim();
  if (!v) { $('#newStep').focus(); return; }
  await run(async () => {
    await flush();
    if (!cur.id) {
      // First thing typed is a step: create the to-do with it.
      const r = await api('/api/todos', { ...newBody(cur), steps: [v] });
      cur.id = r.id; openId = r.id; history.replaceState(null, '', '#todo-' + r.id);
    } else {
      await api(`/api/todos/${cur.id}/steps`, { text: v });
    }
    $('#newStep').value = '';
    await refreshTicket();
  });
}
$('#addStep').onclick = () => { addStep().then(() => $('#newStep').focus()); };
$('#newStep').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addStep(); } });
const stepId = (el) => Number(el.closest('[data-sid]').dataset.sid);
async function saveStep(id, body) {
  await api(`/api/todos/${cur.id}/steps/${id}`, body, 'PATCH');
}
$('#steps').addEventListener('change', (e) => {
  if (e.target.type !== 'checkbox') return;
  const id = stepId(e.target), s = cur.steps.find((x) => x.id === id);
  s.done = e.target.checked; e.target.closest('.step').classList.toggle('done', s.done);
  $('#stepCount').textContent = `${cur.steps.filter((x) => x.done).length} of ${cur.steps.length} done`;
  run(async () => { await saveStep(id, { done: s.done }); await refreshTicket(); });
});
$('#steps').addEventListener('input', (e) => {
  if (e.target.type !== 'text') return;
  const id = stepId(e.target), v = e.target.value;
  const s = cur.steps.find((x) => x.id === id); if (s) s.text = v;
  clearTimeout(stepTimers[id]);
  if (v.trim()) stepTimers[id] = setTimeout(() => { delete stepTimers[id]; run(() => saveStep(id, { text: v })); }, 700);
});
$('#steps').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.type === 'text') { e.preventDefault(); $('#newStep').focus(); } });
$('#steps').addEventListener('focusout', (e) => {
  if (e.target.type !== 'text') return;
  const id = stepId(e.target), v = e.target.value.trim();
  setTimeout(async () => {
    if (stepTimers[id]) { clearTimeout(stepTimers[id]); delete stepTimers[id]; if (v) await run(() => saveStep(id, { text: v })); }
    // An emptied step is removed.
    if (!v && cur && cur.steps.some((x) => x.id === id)) await run(() => api(`/api/todos/${cur.id}/steps/${id}`, undefined, 'DELETE'));
    if (cur && (stepsStale || !v) && !(document.activeElement && document.activeElement.matches('#steps input[type=text]'))) await run(refreshTicket);
  }, 150);
});
$('#steps').addEventListener('click', (e) => {
  if (!e.target.closest('.x')) return;

// ---------- live updates from other screens ----------
let reloadTimer;
function listen() {
  const es = new EventSource('/api/events');
  es.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'hello') return;
    if (m.type === 'todo' && m.by === SCREEN) return; // our own typing
    if (m.type === 'account') { location.reload(); return; } // switched on/off or changed by the admin
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(async () => {
      if (m.type === 'members') { await run(reloadMe); if (cur) renderTicket(); return; }
      if (m.type === 'parts') { if (isShop) Shop.loadParts().catch(() => {}); return; }
      if (m.type === 'customers') { if (isShop) Shop.loadCustomers().catch(() => {}); return; }
      if (m.type === 'qbo') { if (isShop) Shop.qboChanged(); return; }
      if (m.type === 'money') { await loadBoard().catch(() => {}); if (cur && isShop) Shop.loadMoney().catch(() => {}); return; }
      await loadBoard().catch(() => {});
      if (cur && cur.id) {
        if (m.type === 'todo' && m.deleted && m.id === cur.id) { toast('This to-do was deleted on another screen', 'bad'); pending = {}; $('#newStep').value = ''; closeTicket(); }
        else if (m.type === 'columns' || m.id === cur.id) refreshTicket().catch(() => {});
      }
    }, 250);
  };
}
function tick() { $('#clock').textContent = new Date().toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }

(async () => {
  try { me = await api('/api/me'); } catch (e) {
    if (/switched off/.test(e.message)) {
      setTimeout(() => location.reload(), 30000); // comes back by itself when switched on again
      return fullMessage('⏸ This account is switched off', esc(e.message) + ' This screen comes back by itself when it is switched on again.', '<button onclick="logout()">Sign out</button>');
    }
    throw e;
  }
  members = me.members;
  applyAccount();
  if (me.account.screen === 'store') { location.href = '/'; return; } // Store Orders accounts use the store screen
  showMe(); Keys.refresh();
  tick(); setInterval(tick, 30000);
  await loadBoard();
  listen();
  if (!me.member && !me.admin) whoPicker();
  const h = /^#todo-(\d+)$/.exec(location.hash);
  if (h) openTicket(Number(h[1]));
  // Days change at midnight: redraw "due today" and "overdue".
  setInterval(() => { if (!cur) renderBoard(); }, 5 * 60000);
})().catch((e) => toast(e.message, 'bad'));
</script>
</body>
</html>
